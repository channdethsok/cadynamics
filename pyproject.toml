[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cadynamics"
version = "0.3.0"
description = "CADynamics: Modeling CAD Construction Dynamics & Parametric Geometry"
readme = "README.md"
requires-python = ">=3.10"
authors = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Computer-Aided Design (CAD)",
]
dependencies = [
    "torch==2.4.1",
    "torchvision==0.19.1",
    "torchdata==0.7.1",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "pillow>=9.5.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
    "pytest>=7.0.0",
    "ipykernel>=6.20.0",
    "hydra-core>=1.3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["[0-9][0-9]_*.py", "test_*.py"]
