# B-Rep Encoder Architecture
name: "brep_encoder"

# Input feature dimensions from CAD schema (linked to data config via Hydra interpolation)
face_feature_dim: ${oc.select:data.face_feature_dim,32}
edge_feature_dim: ${oc.select:data.edge_feature_dim,16}
uv_channels: ${oc.select:data.uv_channels,7}
curve_channels: ${oc.select:data.curve_channels,6}

# Backbone hyperparameters
hidden_dim: 256
num_heads: 8
num_layers: 6
dropout: 0.1
activation: "gelu"
pooling: "mean"
